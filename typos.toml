[files]
# typos skips hidden paths by default, which would leave .claude/, .github/
# and .githooks/ unchecked; .git is excluded instead so pack data is never scanned.
ignore-hidden = false
extend-exclude = ["*.xcassets", ".build", ".git", "Package.resolved"]

[default.extend-words]
# A simulator's or device's Unique Device Identifier (`xcrun simctl`), not a typo of UUID.
udid = "udid"
