name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft pull request skips the macOS work (see `changes`), so
    # marking it ready starts a fresh run that does it.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # Superseding a pull request cancels its previous run. A push to main is keyed
  # by commit instead, so two quick merges neither cancel one another nor leave
  # main's tip without a finished CI run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # `bash` runs as `bash --noprofile --norc -eo pipefail {0}`; an unnamed shell is
    # `bash -e {0}`, which misses a failure before a `|`.
    shell: bash

jobs:
  lint:
    name: Lint & Format Check
    # Not ubuntu-latest: from ubuntu-26.04 on, the image ships only libxml2.so.16, and
    # the SwiftLint Linux binary mise installs (aqua's realm/SwiftLint entry links the
    # dynamic `swiftlint`, not the release zip's `swiftlint-static`) needs libxml2.so.2.
    # Drop the pin once that install no longer needs libxml2.so.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # XcodeGen/xcbeautify are macOS-only; install just the Linux-capable linters here.
          # just: scripts/checks/just-recipes-exist.sh (and its tests) call it.
          install_args: swiftlint swiftformat actionlint shellcheck typos just

      - name: Lint (swiftformat, swiftlint, shellcheck, actionlint, typos)
        # The same script `just lint` and the pre-commit hook call. No `mise exec`:
        # mise-action already put the tools on PATH, and `mise exec` would try to
        # install the macOS-only tools this job leaves out.
        run: scripts/lint.sh

      - name: Script tests (scripts/tests/run.sh)
        # The same runner `just test-scripts` calls; needs bash, git, python3, and the
        # swiftformat, swiftlint, and just installed above.
        run: scripts/tests/run.sh

      - name: Harness checks (scripts/checks/run-all.sh)
        # The same runner `just check-harness` calls: every check under
        # scripts/checks/, each listed in the changing-gates skill's
        # references/enforcement-layers.md.
        run: scripts/checks/run-all.sh

  # The one macOS gate on this tree: scripts/coverage.sh (what `just test` runs), then
  # `just build` and `just build-device`, the unsigned Release compile for the device
  # SDK no simulator build sees. The UI test, the Release smoke launch, and the iOS
  # Simulator package tests run only in local `just check`, to keep CI's macOS minutes
  # minimal.
  test:
    name: Test & Coverage Gate
    # A run with nothing for this job to do (a push to main, a draft, or a pull request
    # `changes` calls irrelevant) skips every step, so it takes a cheap Ubuntu runner
    # instead of waiting for a macOS one; any other output (true, or empty after a
    # failed `changes`) keeps macOS.
    runs-on: ${{ needs.changes.outputs.simulator == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    # Fail-safe: `!cancelled()` keeps this required job running even when `changes`
    # failed, and its steps skip only on the exact output 'false' — a failed `changes`
    # leaves the output empty, so everything runs. A job skipped outright would report
    # as passing.
    needs: changes
    if: ${{ !cancelled() }}
    # 40, not 30: the job gained a second full app compile (Release, device SDK).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.simulator != 'false'
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode
        if: needs.changes.outputs.simulator != 'false'

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        if: needs.changes.outputs.simulator != 'false'

      - name: Run tests with coverage floor
        if: needs.changes.outputs.simulator != 'false'
        run: scripts/coverage.sh

      - name: Build app (Debug, iOS Simulator)
        if: needs.changes.outputs.simulator != 'false'
        run: just build

      - name: Build app (Release, iOS device, unsigned)
        # The one build for the iphoneos SDK: a device-only compile break or a Release
        # device failure (asset catalog, linker) shows here and in no simulator build,
        # and so does a bundle that ships without PrivacyInfo.xcprivacy.
        # CODE_SIGNING_ALLOWED=NO, so it needs no team or secret; nothing is signed.
        if: needs.changes.outputs.simulator != 'false'
        run: just build-device

  # Decides whether this run has macOS work: the `test` job (and, in the template,
  # `bootstrap-smoke`).
  # Those jobs are required checks, so they always run and report under their own
  # names; they only skip their steps when this job says `simulator=false` (the output
  # keeps its name: scripts/simulator-relevant.sh's path list decides it). A push to
  # main and a draft pull request always say false: main is verified by the pull
  # request that reached it, and a draft runs its macOS work once marked ready.
  changes:
    name: Detect Simulator-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      simulator: ${{ steps.detect.outputs.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        with:
          persist-credentials: false
          # Full history so the merge base of the pull request's base and head exists.
          fetch-depth: 0

      - name: Decide whether the macOS jobs have work
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" || "${IS_DRAFT}" == "true" ]]; then
            echo "simulator=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          # scripts/simulator-relevant.sh holds the only copy of the path list (`just
          # check` asks it too). It diffs the pull request's own change set (three
          # dots: from the merge base), logs the changed files, and prints `true` when
          # the diff fails. If the script itself fails, this step fails before writing
          # the output, and the macOS jobs then run (see below).
          simulator="$(scripts/simulator-relevant.sh --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          echo "simulator=${simulator}" >>"${GITHUB_OUTPUT}"

  bootstrap-smoke:
    # Template-only: scripts/bootstrap.sh removes this job, and its required context in
    # .github/rulesets/main.json, from every app it renames.
    name: Template Bootstrap Smoke
    # Gated like `test`: skips its steps on an Ubuntu runner when `changes` says
    # false, and runs everything when `changes` failed. Nothing else may `needs:` this
    # job, so ci.yml stays valid once bootstrap deletes it.
    runs-on: ${{ needs.changes.outputs.simulator == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    env:
      # 19 characters: long enough to push lines past SwiftFormat's width, so the lint
      # step below proves the rename re-formats the tree.
      DEMO_NAME: LongDemoApplication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.simulator != 'false'
        with:
          persist-credentials: false
          # Full history so the local `git clone` below works from a non-shallow source.
          fetch-depth: 0

      - uses: ./.github/actions/select-xcode
        if: needs.changes.outputs.simulator != 'false'

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        if: needs.changes.outputs.simulator != 'false'

      - name: Bootstrap a pristine copy as the demo app
        if: needs.changes.outputs.simulator != 'false'
        run: |
          git clone . "$RUNNER_TEMP/bootstrap-smoke"
          mise trust "$RUNNER_TEMP/bootstrap-smoke/mise.toml"
          cd "$RUNNER_TEMP/bootstrap-smoke"
          scripts/bootstrap.sh "$DEMO_NAME" --bundle-id-prefix io.example --github-user demo

      - name: Assert no placeholders remain
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          # Author/email placeholders are intentionally kept (no --author/--email above).
          # README's leftover-check line is spelled with wildcards, so it never matches.
          # Lines inside bootstrap's keep markers explain the placeholders on purpose,
          # so they are skipped (the marker names are split so this file never holds one).
          grep -rilE 'my-?app|com\.example|your-username' . --exclude-dir=.git --null >"$RUNNER_TEMP/matches" || [ $? -eq 1 ]
          # shellcheck disable=SC2016 # the perl program's $ variables are perl's, not the shell's
          leftovers=$(KB="bootstrap:keep""-begin" KE="bootstrap:keep""-end" xargs -0 perl -ne '
              $k = 1 if index($_, $ENV{KB}) >= 0;
              print "$ARGV:$.: $_" if !$k && /my-?app|com\.example|your-username/i;
              $k = 0 if index($_, $ENV{KE}) >= 0;
              if (eof) { close ARGV; $k = 0 }
            ' <"$RUNNER_TEMP/matches")
          if [ -n "$leftovers" ]; then
            printf '%s\n' "$leftovers"
            echo "::error::bootstrap left placeholder leftovers on the lines listed above"
            exit 1
          fi

      - name: Assert the placeholder-explaining passages survived
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          # These passages sit between keep markers, so the rename must leave them naming
          # the original placeholders instead of turning them into nonsense.
          status=0
          check() {
            grep -qF -- "$2" "$1" || { echo "::error file=$1::kept passage was rewritten: $2"; status=1; }
          }
          check scripts/bootstrap.sh "#   MyApp        -> NewName"
          check scripts/bootstrap.sh "#   my-app       -> repo slug"
          check README.md "This replaces \`MyApp\` (and \`MyAppKit\`/\`MyAppCore\`/\`MyAppUI\`/\`MyAppPlatform\`), \`my-app\`,"
          check .claude/skills/starting-an-app/SKILL.md "small set of literals — \`MyApp\`, \`my-app\`, \`com.example\`, \`your-username\`, \`Your Name\`,"
          check .claude/skills/starting-an-app/SKILL.md "- **Paths** named after the app (\`MyAppCore\`, \`MyAppUI\`, …) are renamed deepest-first,"
          # The header still prints as usage, without the marker lines (usage exits 1).
          usage_out=$(bash scripts/bootstrap.sh 2>/dev/null || true)
          if grep -F 'bootstrap:keep' <<<"$usage_out"; then
            echo "::error::usage() prints the keep-marker lines"; status=1
          fi
          grep -qF 'MyApp        -> NewName' <<<"$usage_out" || {
            echo "::error::usage() no longer prints the placeholder map"; status=1
          }
          exit "$status"

      - name: Assert the template-only passages were removed
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          # The marker name is split so this file never holds one.
          if grep -rn "bootstrap:template""-only" . --exclude-dir=.git; then
            echo "::error::bootstrap left template-only markers on the lines listed above"
            exit 1
          fi
          if grep -n 'created from this template' SECURITY.md; then
            echo "::error::SECURITY.md still holds a template-only passage"
            exit 1
          fi

      - name: Assert CHANGELOG was reset
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          grep -qF 'Initial project scaffold from' CHANGELOG.md || {
            echo "::error::bootstrap did not reset CHANGELOG.md"
            exit 1
          }
          if grep -qF 'Initial template:' CHANGELOG.md; then
            echo "::error::template history still present in CHANGELOG.md"
            exit 1
          fi

      - name: Assert the template origin was recorded
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          test -f .template-origin || {
            echo "::error::bootstrap did not write .template-origin"
            exit 1
          }
          # This clone has the template's own history, so line 1 must be a real commit
          # (the "unknown" fallback is for a repository created from a fresh history).
          grep -qE '^[0-9a-f]{40}$' <<<"$(sed -n 1p .template-origin)" || {
            echo "::error::.template-origin line 1 is not a 40-hex template commit SHA"
            sed -n 1,2p .template-origin
            exit 1
          }
          test -n "$(sed -n 2p .template-origin)" || {
            echo "::error::.template-origin line 2 (the template repository) is empty"
            exit 1
          }

      - name: Assert the template-only job was retired
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          if grep -nE '^  bootstrap-smoke:$|Template Bootstrap Smoke' .github/workflows/ci.yml .github/rulesets/main.json; then
            echo "::error::bootstrap did not retire the bootstrap-smoke job and its required check"
            exit 1
          fi
          # Every remaining required context still names a job (parses main.json too).
          bash scripts/tests/apply-ruleset_test.sh

      - name: Assert the Product section check now fires
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          # The rename cannot write the new app's product intent, and this check is the
          # only thing that makes a new repository write it: on a renamed tree whose
          # AGENTS.md still holds the template's TODO skeleton it must fail. Asserting
          # that it fires keeps the smoke honest without inventing a product here.
          if out=$(bash scripts/checks/product-section-filled.sh 2>&1); then
            echo "::error::product-section-filled.sh passed on the bootstrapped clone"
            echo "$out"
            exit 1
          fi
          grep -q '^ERR_CHECK_PRODUCT_SECTION: ' <<<"$out" || {
            echo "::error::product-section-filled.sh failed, but not as ERR_CHECK_PRODUCT_SECTION"
            echo "$out"
            exit 1
          }

      - name: Lint the renamed tree
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          # What the pre-commit hook runs on the bootstrap commit; a renamed tree that
          # breaks a line width or the import order fails here.
          scripts/lint.sh

      - name: Check the renamed skill descriptions
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          # skills-descriptions.sh already runs on every pull request and refuses a
          # description that names a placeholder, so the rename cannot lengthen one; this
          # re-runs it on the renamed tree in case a placeholder slips past that rule.
          bash scripts/checks/skills-descriptions.sh

      - name: Test the renamed package
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke/Packages/${DEMO_NAME}Kit"
          swift test

      - name: Build the renamed app
        if: needs.changes.outputs.simulator != 'false'
        run: |
          cd "$RUNNER_TEMP/bootstrap-smoke"
          xcodegen generate
          set -o pipefail
          xcodebuild -project "$DEMO_NAME.xcodeproj" -scheme "$DEMO_NAME" -configuration Debug -destination 'generic/platform=iOS Simulator' build | xcbeautify --quiet

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Plain annotations instead of SARIF upload — keeps permissions read-only.
          advanced-security: false
