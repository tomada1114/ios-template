name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # `bash` runs as `bash --noprofile --norc -eo pipefail {0}`; an unnamed shell is
    # `bash -e {0}`, which misses a failure before a `|`
    # (scripts/checks/workflow-hygiene.sh).
    shell: bash

jobs:
  analyze:
    name: Analyze Swift
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual

      - name: Build the package for analysis
        # App/ is a thin @main shell; all logic lives in the local package
        # (AGENTS.md › Architecture), so building it covers every analyzable line.
        # `--disable-sandbox` skips SwiftPM's `sandbox-exec` wrapper: CodeQL's tracer is
        # injected into it and `posix_spawn` fails with "Bad CPU type in executable"
        # (#99). It covers the manifest build and any package plugin (the package has
        # none), on an ephemeral runner; sources are still compiled and analyzed. Drop
        # the flag once a CodeQL or Xcode release stops tracing `sandbox-exec` -- try
        # removing it on a workflow_dispatch run.
        run: swift build --disable-sandbox --package-path Packages/MyAppKit

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
