# actionlint's built-in list of GitHub-hosted runner labels predates the `xcode-27`
# image (GitHub's Xcode 27 runner, https://github.com/actions/runner-images/issues/14404),
# so it is declared here; it is a GitHub-hosted label, not a self-hosted runner. Drop it
# once actionlint knows the label on its own.
self-hosted-runner:
  labels:
    - xcode-27
